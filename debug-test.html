<!DOCTYPE html>
<html>
<head>
    <title>Flutter Debug Test</title>
    <base href="/">
</head>
<body>
    <div id="status">Testing Flutter loading...</div>
    
    <script>
        console.log('Starting Flutter debug test...');
        
        // Test 1: Check if flutter.js loads
        console.log('Loading flutter.js...');
    </script>
    
    <script src="flutter.js" defer onload="console.log('flutter.js loaded successfully')" onerror="console.error('Failed to load flutter.js')"></script>
    
    <script>
        window.addEventListener('load', function() {
            console.log('Page loaded, checking _flutter object...');
            
            if (typeof _flutter === 'undefined') {
                console.error('_flutter is not defined!');
                document.getElementById('status').innerHTML = 'ERROR: _flutter not defined';
                return;
            }
            
            console.log('_flutter object found:', _flutter);
            
            if (!_flutter.loader) {
                console.error('_flutter.loader is not defined!');
                document.getElementById('status').innerHTML = 'ERROR: _flutter.loader not defined';
                return;
            }
            
            console.log('_flutter.loader found, attempting to load...');
            document.getElementById('status').innerHTML = 'Attempting Flutter load...';
            
            try {
                _flutter.loader.load({
                    serviceWorkerSettings: {
                        serviceWorkerVersion: "937389487"
                    },
                    onEntrypointLoaded: function(engineInitializer) {
                        console.log('Entrypoint loaded successfully!', engineInitializer);
                        document.getElementById('status').innerHTML = 'Entrypoint loaded, initializing engine...';
                        
                        return engineInitializer.initializeEngine().then(function(appRunner) {
                            console.log('Engine initialized successfully!', appRunner);
                            document.getElementById('status').innerHTML = 'Engine initialized, running app...';
                            
                            return appRunner.runApp().then(function() {
                                console.log('App started successfully!');
                                document.getElementById('status').innerHTML = 'SUCCESS: Flutter app is running!';
                            });
                        }).catch(function(error) {
                            console.error('Failed to initialize engine:', error);
                            document.getElementById('status').innerHTML = 'ERROR: Failed to initialize engine - ' + error.message;
                        });
                    }
                }).catch(function(error) {
                    console.error('Failed to load Flutter:', error);
                    document.getElementById('status').innerHTML = 'ERROR: Failed to load Flutter - ' + error.message;
                });
            } catch (error) {
                console.error('Exception during Flutter load:', error);
                document.getElementById('status').innerHTML = 'EXCEPTION: ' + error.message;
            }
        });
    </script>
</body>
</html>

name: Deploy Tip Calculator PWA

on:
  push:
    branches: [ TipCalc ]
  pull_request:
    branches: [ TipCalc ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Grant GITHUB_TOKEN the permissions required for deployment
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm run test:all
    
    - name: Validate PWA files
      run: |
        # Check manifest.json is valid
        cat manifest.json | jq '.'
        # Check service worker exists
        test -f sw.js
        # Check required icons exist
        test -f icons/icon-192.png || echo "Warning: icon-192.png missing"
        test -f icons/icon-512.png || echo "Warning: icon-512.png missing"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/TipCalc'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy tip calculator PWA from TipCalc branch'
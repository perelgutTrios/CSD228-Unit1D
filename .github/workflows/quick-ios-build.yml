name: 🔥 Quick iOS Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build Name (optional)'
        required: false
        default: 'quick-build'

jobs:
  quick-ios-build:
    name: ⚡ Fast iOS Build
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'
        cache: true

    - name: ⚡ Quick Build
      run: |
        flutter pub get
        cd ios && pod install && cd ..
        flutter build ios --release --no-codesign

    - name: 📦 Package Quick Build
      run: |
        mkdir -p quick-ios-build
        
        if [ -d "build/ios/iphoneos/Runner.app" ]; then
          cp -r build/ios/iphoneos/Runner.app quick-ios-build/
          echo "✅ Quick iOS build completed successfully!" > quick-ios-build/SUCCESS.txt
        else
          echo "❌ Build failed - no Runner.app found" > quick-ios-build/ERROR.txt
        fi
        
        echo "Build Name: ${{ github.event.inputs.build_name || 'quick-build' }}" > quick-ios-build/INFO.txt
        echo "Build Time: $(date)" >> quick-ios-build/INFO.txt
        echo "Commit: ${{ github.sha }}" >> quick-ios-build/INFO.txt

    - name: ⬆️ Upload Quick Build
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.build_name || 'quick-build' }}-${{ github.run_number }}
        path: quick-ios-build/
        retention-days: 7
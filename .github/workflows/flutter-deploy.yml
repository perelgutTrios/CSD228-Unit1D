name: Deploy Flutter Web App

on:
  push:
    branches: [ TipCalcFlutter ]
  pull_request:
    branches: [ TipCalcFlutter ]

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
    
    - name: Enable Flutter Web
      run: flutter config --enable-web
    
    - name: Get Flutter dependencies
      run: flutter pub get
    
    - name: Build Flutter Web app
      run: flutter build web --web-renderer html --base-href "/CSD228-Unit1D/"
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/web
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/TipCalcFlutter'
<!-- Enhanced Calculator Icon SVG -->
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />
  
  <!-- Calculator body -->
  <rect x="128" y="96" width="256" height="320" rx="24" fill="url(#calcGradient)" />
  
  <!-- Display screen -->
  <rect x="152" y="120" width="208" height="64" rx="8" fill="#1a252f" />
  <text x="344" y="160" font-family="Courier New, monospace" font-size="28" font-weight="bold" text-anchor="end" fill="#00ff41">123</text>
  
  <!-- Button grid -->
  <!-- Row 1 -->
  <rect x="152" y="200" width="48" height="32" rx="6" fill="#e74c3c" />
  <text x="176" y="220" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">RST</text>
  
  <rect x="216" y="200" width="32" height="32" rx="6" fill="#f39c12" />
  <text x="232" y="220" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">+</text>
  
  <rect x="264" y="200" width="32" height="32" rx="6" fill="#f39c12" />
  <text x="280" y="220" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">-</text>
  
  <!-- Row 2 -->
  <rect x="152" y="248" width="32" height="32" rx="6" fill="#34495e" />
  <text x="168" y="268" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">7</text>
  
  <rect x="200" y="248" width="32" height="32" rx="6" fill="#34495e" />
  <text x="216" y="268" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">8</text>
  
  <rect x="248" y="248" width="32" height="32" rx="6" fill="#34495e" />
  <text x="264" y="268" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">9</text>
  
  <!-- Calculate button (vertical) -->
  <rect x="312" y="248" width="48" height="104" rx="6" fill="#27ae60" />
  <text x="336" y="305" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">CALC</text>
  
  <!-- Row 3 -->
  <rect x="152" y="296" width="32" height="32" rx="6" fill="#34495e" />
  <text x="168" y="316" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <rect x="200" y="296" width="32" height="32" rx="6" fill="#34495e" />
  <text x="216" y="316" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
  
  <rect x="248" y="296" width="32" height="32" rx="6" fill="#34495e" />
  <text x="264" y="316" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">6</text>
  
  <!-- Row 4 -->
  <rect x="152" y="344" width="32" height="32" rx="6" fill="#34495e" />
  <text x="168" y="364" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <rect x="200" y="344" width="32" height="32" rx="6" fill="#34495e" />
  <text x="216" y="364" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <rect x="248" y="344" width="32" height="32" rx="6" fill="#34495e" />
  <text x="264" y="364" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <!-- Row 5 -->
  <rect x="152" y="392" width="80" height="32" rx="6" fill="#34495e" />
  <text x="192" y="412" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">0</text>
</svg>